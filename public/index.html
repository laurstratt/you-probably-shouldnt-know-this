<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>You Probably Shouldn't Know This</title><style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');
:root{--cream:#fff4dc;--orange:#f06445;--yellow:#f6c453;--green:#8ca58a;--ink:#17130f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;min-height:100vh}button,input{font:inherit}.wrap{max-width:900px;margin:auto;padding:28px 18px 50px}.logo{font-weight:700;text-transform:uppercase;font-size:clamp(42px,9vw,88px);line-height:.82;letter-spacing:-2px;color:var(--orange);text-shadow:5px 5px 0 var(--ink);-webkit-text-stroke:2px var(--ink);transform:rotate(-1deg);display:inline-block}.tag{font-size:clamp(16px,3vw,24px);margin:22px 0 28px}.card{background:#fffaf0;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:22px;padding:24px;margin:18px 0}.row{display:flex;gap:12px;flex-wrap:wrap}.input{flex:1;min-width:200px;border:3px solid var(--ink);border-radius:14px;padding:14px 16px;background:white}.btn{border:3px solid var(--ink);border-radius:15px;padding:14px 20px;background:var(--orange);color:white;font-weight:700;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}.btn.alt{background:var(--yellow);color:var(--ink)}.btn.green{background:var(--green)}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.code{font-size:42px;letter-spacing:8px;font-weight:700}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.player{border:3px solid var(--ink);border-radius:14px;padding:12px;background:white}.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:5px 10px;background:var(--yellow);font-size:13px;font-weight:700}.q{font-size:clamp(26px,5vw,48px);line-height:1.05;margin:16px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:78px;text-align:left;background:white;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:15px;font-weight:600;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}.answer.selected{background:var(--yellow)}.answer:disabled{opacity:.55}.timer{font-size:30px;font-weight:700}.hidden{display:none}.msg{font-weight:600;margin:12px 0}.score{font-size:22px;font-weight:700}.winner{font-size:clamp(38px,8vw,70px);color:var(--orange);text-shadow:4px 4px var(--ink)}@media(max-width:600px){.answers{grid-template-columns:1fr}.wrap{padding:18px 14px}.card{padding:18px;box-shadow:5px 5px 0 var(--ink)}.logo{font-size:50px}.code{font-size:34px}}
</style></head><body><main class="wrap"><div class="logo">You Probably<br>Shouldn't Know<br>This</div><div class="tag">Useless knowledge. Questionable choices. Unnecessary confidence.</div><section id="home" class="card"><h2>Ready to make questionable decisions?</h2><div class="row"><input id="name" class="input" maxlength="18" placeholder="Your username"><button class="btn" onclick="createRoom()">CREATE ROOM</button></div><hr><div class="row"><input id="joinCode" class="input" maxlength="6" placeholder="ROOM CODE"><button class="btn alt" onclick="joinRoom()">JOIN GAME</button></div><div id="homeMsg" class="msg"></div></section><section id="lobby" class="card hidden"><span class="pill">ROOM</span><div id="roomCode" class="code"></div><p>Send the code to your friends. 2–8 players.</p><div id="players" class="players"></div><div class="row" style="margin-top:18px"><button id="startBtn" class="btn green hidden" onclick="send({type:'start'})">START GAME</button></div><div id="lobbyMsg" class="msg"></div></section><section id="game" class="card hidden"><div class="row" style="justify-content:space-between"><span id="category" class="pill"></span><span id="round"></span><span id="timer" class="timer"></span></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="gameMsg" class="msg"></div><div id="scores" class="players"></div></section><section id="results" class="card hidden"><div class="pill">ROUND OVER</div><div id="resultText" class="q"></div><div id="resultScores" class="players"></div></section><section id="finished" class="card hidden"><div class="winner">WE HAVE A WINNER.</div><div id="finalScores" class="players"></div><button id="againBtn" class="btn" onclick="send({type:'again'})">PLAY AGAIN</button></section></main><script>
let ws=null,me=null,state=null,timer=null,locked=false;
const $=id=>document.getElementById(id);
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>{};ws.onclose=()=>{if($('home').classList.contains('hidden')) $('gameMsg').textContent='Connection lost. Refresh to reconnect.'};ws.onmessage=e=>handle(JSON.parse(e.data))}
function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}
function name(){return ($('name').value.trim()||'Player').slice(0,18)}
function createRoom(){connect();setTimeout(()=>send({type:'create',name:name()}),150)}
function joinRoom(){let c=$('joinCode').value.trim().toUpperCase();if(c.length!==6){$('homeMsg').textContent='Enter the 6-character room code.';return}connect();setTimeout(()=>send({type:'join',code:c,name:name()}),150)}
function show(id){['home','lobby','game','results','finished'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function handle(d){if(d.type==='error'){$('homeMsg').textContent=d.message;return}if(d.type==='locked'){$('gameMsg').textContent='LOCKED IN. May the worst answer win.';locked=true;return}if(d.type==='state'){state=d;render()}}
function render(){if(state.state==='lobby'){show('lobby');$('roomCode').textContent=state.code;renderPlayers('players');$('startBtn').classList.toggle('hidden',!(state.players.some(p=>p.host&&p.id===me)||state.players.length>=2));if(!me){let m=state.players.find(p=>p.name===name());me=m?.id}}else if(state.state==='playing'){show('game');renderGame()}else if(state.state==='results'){show('results');renderResults()}else if(state.state==='finished'){show('finished');renderFinal()}}
function renderPlayers(id){$(id).innerHTML=state.players.map(p=>`<div class="player"><b>${esc(p.name)}</b>${p.host?' ⭐':''}<div class="score">${p.score} pts</div></div>`).join('')}
function renderGame(){locked=false;let q=state.question;$('category').textContent=q.cat||q.type.toUpperCase();$('round').textContent=`ROUND ${state.round+1} / ${state.total}`;$('q').textContent=q.q||q.title+' — '+q.text;$('timer').textContent='';$('answers').innerHTML='';$('gameMsg').textContent='';if(q.promptType==='trivia'){q.a.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>{if(locked)return;locked=true;b.classList.add('selected');send({type:'answer',answer:i})};$('answers').appendChild(b)})}else if(q.promptType==='funny'){q.a.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>{if(locked)return;locked=true;b.classList.add('selected');send({type:'answer',answer:i})};$('answers').appendChild(b)})}else if(q.promptType==='who'){state.players.forEach(p=>{let b=document.createElement('button');b.className='answer';b.textContent=p.name;b.onclick=()=>{if(locked)return;locked=true;b.classList.add('selected');send({type:'vote',target:p.id})};$('answers').appendChild(b)})}else if(q.promptType==='chaos'){$('gameMsg').textContent=q.text}else if(q.type==='wager'||q.type==='final'){q.a.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>{if(locked)return;let amount=Math.min(state.players.find(p=>p.id===me)?.score||0,100);send({type:'wager',amount});locked=true;b.classList.add('selected');send({type:'answer',answer:i})};$('answers').appendChild(b)})}renderPlayers('scores')}
function renderResults(){$('resultText').textContent='That round is over. Friendship remains questionable.';renderPlayers('resultScores')}
function renderFinal(){let sorted=[...state.players].sort((a,b)=>b.score-a.score);$('finalScores').innerHTML=sorted.map((p,i)=>`<div class="player"><b>${i===0?'🏆 ':''}${esc(p.name)}</b><div class="score">${p.score} pts</div></div>`).join('');$('againBtn').classList.toggle('hidden',!sorted.some(p=>p.id===me&&p.host))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
